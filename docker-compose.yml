services:
  db:
    image: mysql:8.4
    container_name: wedding_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wedding
      MYSQL_USER: wedding_user
      MYSQL_PASSWORD: wedding_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: wedding_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://wedding_user:wedding_password@db:3306/wedding"
      ORIGIN: "http://localhost:3000"
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  mysql_data: